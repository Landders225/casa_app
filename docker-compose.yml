# CASA — Environnement Docker du Lot 0 (squelette).
# 4 services : postgres, backend (Laravel/PHP-FPM), frontend (React/nginx),
# nginx (reverse proxy unique : /api -> backend, / -> frontend).
# Démarrage : voir README.md à la racine du monorepo.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casa}
      POSTGRES_USER: ${POSTGRES_USER:-casa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casa} -d ${POSTGRES_DB:-casa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [casa]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      # Pièces justificatives stockées hors webroot (cf. docs/ADR.md) : jamais
      # sous public/, jamais servies directement par nginx.
      - documents_data:/var/www/html/storage/app/private
      # Surcharges PHP (limites d'upload — Lot 3b).
      - ./docker/php/casa.ini:/usr/local/etc/php/conf.d/zz-casa.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Pas de serveur HTTP dans ce conteneur (PHP-FPM parle FastCGI sur le
      # port 9000) : on vérifie que le port FPM répond, via PHP lui-même.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [casa]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [casa]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx doit voir public/ pour résoudre try_files avant de déléguer au
      # backend en fastcgi (cf. docs/ADR.md, note reverse proxy).
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 explicite (pas "localhost") : le default.conf est monté en
      # lecture seule, donc le script d'entrypoint nginx qui ajoute
      # normalement l'écoute IPv6 ne peut pas le modifier — "localhost" peut
      # résoudre en ::1 en priorité et échouer alors que le service répond
      # bien en IPv4.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [casa]

volumes:
  postgres_data:
  documents_data:

networks:
  casa:
    driver: bridge
