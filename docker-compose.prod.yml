# =============================================================================
#  CASA — Override de PRODUCTION (Lot 9b, ADR-27).
#
#  N'exprime QUE les différences avec docker-compose.yml (dev). Le fichier dev
#  reste strictement inchangé et utilisable pour le développement.
#
#  Lancement :
#    docker compose --env-file .env.production \
#      -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  Pré-requis :
#   - .env.production            (racine — vars compose : POSTGRES_PASSWORD, TLS_DIR, …)
#   - backend/.env.production    (Laravel — APP_KEY régénéré, APP_DEBUG=false, domaine, …)
#   - un certificat dans ${TLS_DIR} : `docker/nginx/gen-selfsigned.sh` pour amorcer,
#     puis le vrai cert Let's Encrypt (voir README « Configuration de production »).
#
#  Différences vs dev :
#   - backend : plus de bind-mount du code (image figée) ; env injecté par
#     backend/.env.production ; APP_ENV/APP_DEBUG viennent de ce fichier.
#   - nginx   : TLS (80 + 443), conf de prod (en-têtes de sécurité + CSP + HTTPS),
#     montage des certificats et du webroot ACME.
#   - postgres: mot de passe obligatoire (pas de valeur par défaut faible).
# =============================================================================

# Nom de projet FIXE en prod (indépendant du nom du dossier de déploiement) :
# le réseau devient `casa_casa`, les conteneurs `casa-<service>-1`. Rend les
# commandes de docs/DEPLOIEMENT.md déterministes quel que soit le chemin du clone.
name: casa

services:
  postgres:
    environment:
      # Pas de fallback : `docker compose config` échoue si POSTGRES_PASSWORD
      # n'est pas fourni par .env.production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis en production}

  backend:
    # Le code vient de l'IMAGE (pas de bind-mount ./backend). On garde uniquement
    # le volume des pièces (hors webroot, ADR-11), la surcharge PHP et l'entrypoint.
    volumes: !override
      - documents_data:/var/www/html/storage/app/private
      - ./docker/php/casa.ini:/usr/local/etc/php/conf.d/zz-casa.ini:ro
      - ./docker/backend/entrypoint.sh:/usr/local/bin/casa-entrypoint.sh:ro
    # Reconstruit config:cache / route:cache / event:cache / view:cache à chaque
    # démarrage → toujours cohérents avec l'env courant (Lot 9c, ADR-28). Les
    # migrations restent une étape MANUELLE (docs/DEPLOIEMENT.md).
    entrypoint: ["sh", "/usr/local/bin/casa-entrypoint.sh"]
    # ⚠️ Compose REMET le CMD de l'image à null dès qu'on surcharge `entrypoint`.
    # On redéclare donc explicitement la commande (= `CMD ["php-fpm"]` du
    # Dockerfile) pour que l'entrypoint ait quelque chose à `exec "$@"`.
    command: ["php-fpm"]
    # Config Laravel : lue depuis ce fichier (aucun .env dans l'image —
    # .dockerignore l'exclut). `env()` résout depuis l'environnement du conteneur.
    env_file:
      - ./backend/.env.production

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      # Conf de prod PAR-DESSUS la conf dev (même cible → celle-ci l'emporte).
      - ./docker/nginx/casa.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx doit voir public/ pour try_files avant de déléguer en fastcgi.
      - ./backend/public:/var/www/html/public:ro
      # Certificats TLS — contenu piloté par le montage, chemins FIXES côté conteneur.
      - ${TLS_DIR:-./docker/nginx/tls}:/etc/nginx/tls:ro
      # Webroot du challenge ACME (certbot --webroot, renouvellement à chaud).
      - ./docker/nginx/acme-webroot:/var/www/acme:ro
    healthcheck:
      # La sonde interne passe par HTTPS (self-signed accepté avec --no-check-certificate).
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://127.0.0.1/up"]

# --- Sous-réseau Docker FIXE (Lot 11 — durcissement) -------------------------
# En dev, `casa` prend un /16 aléatoire. En prod on le FIGE : c'est la valeur
# EXACTE que `TRUSTED_PROXIES` (backend/.env.production) doit contenir — Laravel
# ne fait alors confiance à `X-Forwarded-For` que pour les hops de CE réseau et
# lit l'IP client réelle sans se laisser usurper (critique derrière un Apache
# mutualisé — voir docs/DEPLOIEMENT.md § 13). Changer via CASA_SUBNET si
# collision d'adresses (répercuter dans backend/.env.production ET
# docker/nginx/casa.apache.conf : set_real_ip_from).
networks:
  casa:
    ipam:
      config:
        - subnet: ${CASA_SUBNET:-172.31.243.0/24}
