; CASA — surcharges PHP pour le conteneur backend (Lot 3b).
; Monté en /usr/local/etc/php/conf.d/zz-casa.ini via docker-compose.yml.
;
; Upload des pièces justificatives : limite applicative réelle = 10 Mo
; (DeposerPieceRequest, max:10240). Ces valeurs donnent la marge nécessaire
; pour l'enveloppe multipart ; un fichier > 10 Mo est rejeté proprement en 422
; par Laravel, un envoi > 13 Mo est coupé par nginx (413).
upload_max_filesize = 12M
post_max_size = 13M
max_file_uploads = 20
