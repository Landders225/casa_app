# =============================================================================
#  CASA — VirtualHost Apache (reverse-proxy vers le conteneur nginx de CASA).
#
#  Pour un serveur qui héberge DÉJÀ d'autres applications derrière Apache.
#  Apache reste la seule façade sur 80/443 et termine le TLS ; CASA tourne en
#  HTTP local (docker-compose.apache.yml → 127.0.0.1:8090) et n'est PAS exposé.
#
#  ── Installation ─────────────────────────────────────────────────────────────
#   1. Modules requis :
#        sudo a2enmod proxy proxy_http headers rewrite ssl
#   2. Copier ce fichier et adapter les Define ci-dessous (domaine + e-mail) :
#        sudo cp docker/apache/casa.vhost.conf /etc/apache2/sites-available/casa.conf
#        sudo nano /etc/apache2/sites-available/casa.conf
#   3. Activer + recharger :
#        sudo a2ensite casa
#        sudo apache2ctl configtest && sudo systemctl reload apache2
#   4. Certificat Let's Encrypt — le VirtualHost :443 ci-dessous s'active TOUT
#      SEUL dès que le certificat existe (<IfFile>) :
#        sudo apt install certbot
#        sudo certbot certonly --apache -d casa.exemple.ci \
#             -m admin@exemple.ci --agree-tos --no-eff-email
#        sudo systemctl reload apache2
#      Hook de rechargement au renouvellement (une fois) :
#        echo 'systemctl reload apache2' | sudo tee /etc/letsencrypt/renewal-hooks/deploy/reload-apache.sh
#        sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/reload-apache.sh
#
#  Tant qu'il n'y a pas de certificat : seul le VirtualHost :80 est actif et
#  proxifie directement (pratique pour tester `/up` et le chargement de la SPA).
#  ⚠️ La CONNEXION à CASA exige HTTPS (cookies `Secure`) : le login ne fonctionne
#  réellement qu'une fois le certificat en place.
# =============================================================================

# --- Paramètres : les SEULES lignes à changer -------------------------------
Define CASA_DOMAIN        casa.exemple.ci
Define CASA_ADMIN_EMAIL   admin@exemple.ci
Define CASA_UPSTREAM      http://127.0.0.1:8090
Define CASA_TLS_CERT      /etc/letsencrypt/live/${CASA_DOMAIN}/fullchain.pem
Define CASA_TLS_KEY       /etc/letsencrypt/live/${CASA_DOMAIN}/privkey.pem
Define CASA_TLS_CHAIN     /etc/letsencrypt/live/${CASA_DOMAIN}/chain.pem

<VirtualHost *:80>
    ServerName   ${CASA_DOMAIN}
    ServerAdmin  ${CASA_ADMIN_EMAIL}

    ErrorLog  ${APACHE_LOG_DIR}/casa_error.log
    CustomLog ${APACHE_LOG_DIR}/casa_access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    # Ce vhost sert en clair : on l'annonce tel quel à Laravel (trustProxies).
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"

    ProxyPass        "/" "${CASA_UPSTREAM}/" retry=0
    ProxyPassReverse "/" "${CASA_UPSTREAM}/"

    # Dès qu'un certificat existe, tout le trafic clair bascule en HTTPS. Avant,
    # cette règle est inerte et le proxy ci-dessus répond directement.
    <IfFile "${CASA_TLS_CERT}">
        RewriteEngine On
        RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,R=301]
    </IfFile>
</VirtualHost>

# --- HTTPS : s'active automatiquement quand le certificat est présent -------
<IfFile "${CASA_TLS_CERT}">
<VirtualHost *:443>
    ServerName   ${CASA_DOMAIN}
    ServerAdmin  ${CASA_ADMIN_EMAIL}

    ErrorLog  ${APACHE_LOG_DIR}/casa_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/casa_ssl_access.log combined

    SSLEngine on
    SSLCertificateFile    ${CASA_TLS_CERT}
    SSLCertificateKeyFile ${CASA_TLS_KEY}
    <IfFile "${CASA_TLS_CHAIN}">
        SSLCertificateChainFile ${CASA_TLS_CHAIN}
    </IfFile>
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # HSTS : Apache possède le TLS → c'est ici qu'il se pose (le nginx de CASA
    # ne l'émet volontairement pas). Ajouter ` preload` seulement après
    # soumission consciente sur https://hstspreload.org.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPass        "/" "${CASA_UPSTREAM}/" retry=0
    ProxyPassReverse "/" "${CASA_UPSTREAM}/"
</VirtualHost>
</IfFile>
