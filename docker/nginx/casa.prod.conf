# =============================================================================
#  CASA — Reverse-proxy nginx, PRODUCTION (Lot 9b, ADR-27).
#
#  Monté par docker-compose.prod.yml PAR-DESSUS docker/nginx/default.conf (dev,
#  HTTP seul, inchangé). Un seul point d'entrée : ce conteneur termine le TLS.
#
#    :80   -> 301 vers https://  (sauf /.well-known/acme-challenge/ : webroot certbot)
#    :443  -> TLS + en-têtes de sécurité + CSP, puis :
#             /api /sanctum /up  -> backend Laravel (PHP-FPM, fastcgi, HTTPS=on)
#             /*                 -> frontend React (build statique)
#
#  AUCUNE valeur en dur ici :
#   - `server_name _` (l'app est le seul vhost ; les redirections utilisent $host) ;
#   - chemins de certificats FIXES DANS LE CONTENEUR (/etc/nginx/tls/…), le
#     contenu vient du montage `${TLS_DIR}:/etc/nginx/tls:ro` (compose).
#
#  Bootstrap : `docker/nginx/gen-selfsigned.sh` pose un cert auto-signé jetable
#  pour que nginx démarre avant Let's Encrypt (œuf/poule ACME). Voir README.
# =============================================================================

# --- En-têtes de sécurité : définis une fois, ré-utilisés dans les deux server{}
#     via `include`. `always` = envoyés aussi sur les réponses d'erreur (4xx/5xx).
#     Placé dans un fichier séparé inclus, car `add_header` ne s'hérite PAS d'un
#     bloc parent dès qu'un bloc enfant déclare son propre `add_header`.

# Redirection HTTP -> HTTPS. Laisse passer le challenge ACME (renouvellement
# certbot --webroot pendant que nginx tourne).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Ne pas révéler la version de nginx (en-tête Server + pages d'erreur) — Lot 10, T3.
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    server_tokens off;   # pas de version nginx dans l'en-tête Server (Lot 10, T3)

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key  /etc/nginx/tls/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling : no-op tant que le cert est auto-signé (pas d'URI OCSP) ;
    # actif dès le passage sur un cert Let's Encrypt.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=30s ipv6=off;   # DNS interne Docker
    resolver_timeout 5s;

    # --- En-têtes de sécurité (bloc HTTPS uniquement — HSTS n'a de sens qu'ici)
    # HSTS : 1 an + includeSubDomains. `preload` VOLONTAIREMENT absent (Lot 9c,
    # ADR-28) : soumettre le domaine à hstspreload.org est engageant et lent à
    # défaire (le retrait de la liste prend des mois et transite par une release
    # de navigateur). Opt-in conscient une fois la prod stable : ajouter ` preload`
    # à la valeur ci-dessous, redémarrer nginx, puis soumettre sur
    # https://hstspreload.org. Pré-requis de la liste : le domaine APEX doit servir
    # ce header, includeSubDomains présent, max-age ≥ 31536000, redirection
    # http→https (déjà le cas ici).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # CSP — app 100% vendored (npm), aucun CDN à autoriser. `script-src 'self'`
    # STRICT (dist/index.html n'a aucun script inline). Deux relâchements, tous
    # deux SANS vecteur d'exécution de code :
    #   - style-src 'unsafe-inline' : IMPOSÉ par les attributs `style={{…}}` React
    #     (CSP style-src gouverne aussi les attributs style=) ;
    #   - font-src data: : Vite inline les sous-jeux de police < 4 Ko (@fontsource
    #     vietnamien/cyrillique, fa-v4compat) en `data:` dans le CSS bundlé.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Upload des pièces (limite applicative 10 Mo + marge multipart, cf. casa.ini).
    client_max_body_size 13m;

    # --- Rien de sensible n'est atteignable ------------------------------
    # Les pièces vivent dans storage/app/private (HORS du root nginx, ADR-11) et
    # ne se téléchargent QUE par GET /api/pieces/{id}/download (route Laravel,
    # policy propriétaire). Sans ces règles, /storage/... et /.env retomberaient
    # sur le fallback SPA (index.html, 200) — inoffensif mais trompeur pour un
    # scanner. On renvoie un 404 franc.
    location ~ /\. { return 404; }
    location ^~ /storage/ { return 404; }

    # --- Backend Laravel : API, Sanctum, sonde ---------------------------
    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }
    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # HTTPS explicite : ce bloc n'est atteint que via :443, $https = "on".
        # Laravel voit $request->secure() === true NATIVEMENT (fastcgi_param,
        # pas un en-tête forgeable). X-Forwarded-* posés en ÉCRASEMENT (jamais
        # d'append) → non-spoofables ; `REMOTE_ADDR` reste l'IP client réelle
        # (nginx est le edge). Voir aussi bootstrap/app.php `trustProxies`.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_read_timeout 60s;
    }

    # Lot 13 (ADR-32) — la page de saisie du nouveau mot de passe reçoit le
    # token de réinitialisation dans sa query string (?token=&email=) : exclue
    # des logs d'accès pour ne pas y archiver de token (défense en profondeur,
    # en plus de l'expiration 60 min + l'usage unique, déjà natifs). `location =`
    # (exact) est prioritaire sur `location /` ci-dessous, query string incluse.
    location = /mot-de-passe/nouveau {
        access_log off;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Frontend React (SPA) — proxy vers le conteneur `frontend` -------
    # Aucun `add_header` ici : les en-têtes de sécurité du niveau server{}
    # s'appliquent (add_header ne s'hérite que si l'enfant n'en déclare aucun).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
