# =============================================================================
#  CASA — Reverse-proxy nginx, DERRIÈRE UN APACHE EXISTANT (Lot 11).
#
#  Monté par docker-compose.apache.yml. nginx écoute UNIQUEMENT en HTTP sur :80
#  (dans le conteneur), publié sur 127.0.0.1:${CASA_HTTP_PORT}. Il ne voit jamais
#  Internet : Apache (même hôte) termine le TLS et proxifie vers ce port.
#
#    :80  ->  /api /sanctum /up  -> backend Laravel (PHP-FPM, fastcgi)
#             /*                 -> frontend React (build statique)
#
#  Le schéma HTTPS est porté par l'en-tête `X-Forwarded-Proto: https` posé par
#  Apache ; `trustProxies` (bootstrap/app.php) le fait voir à Laravel comme une
#  requête sécurisée → cookies `Secure`, URLs `https://`. On NE force PAS
#  `fastcgi_param HTTPS` ici (ce serait faux si Apache servait un jour en clair).
#
#  ⚠️ SÉCURITÉ : `TRUSTED_PROXIES` (backend/.env.production) DOIT valoir le
#  sous-réseau Docker de CASA (CASA_SUBNET), JAMAIS « * ». Apache AJOUTE l'IP
#  client à X-Forwarded-For sans écraser ce que le client a mis : avec « * » un
#  client qui envoie son propre `X-Forwarded-For` usurpe son IP → contournement
#  du rate-limiting keyé IP + logs pollués. Avec CASA_SUBNET, Laravel remonte la
#  chaîne XFF et s'arrête au 1er hop hors du réseau CASA = l'IP client réelle.
#
#  HSTS : ajouté par APACHE (il possède le TLS), pas ici — un `Strict-Transport-
#  Security` envoyé sur le hop HTTP interne serait ignoré par le navigateur.
# =============================================================================

# Restauration de l'IP client dans les logs nginx. On ne fait confiance QU'AU
# sous-réseau Docker de CASA (= CASA_SUBNET, fixé dans docker-compose.prod.yml) :
#  - Apache tape nginx en loopback → Docker masque la source en gateway du
#    réseau CASA (172.31.243.1), qui est dans ce /24 ;
#  - AUCUNE plage privée large : un client du LAN (172.30.0.0/16 ici) ne doit
#    jamais pouvoir se faire passer pour un proxy et usurper une IP.
# ⚠️ Garder synchronisé avec CASA_SUBNET si vous le changez.
set_real_ip_from 172.31.243.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;                 # pas de version nginx (Lot 10, T3)
    client_max_body_size 13m;          # 10 Mo applicatif + marge multipart

    # --- En-têtes de sécurité (Lot 9b/10) — HSTS exclu (géré par Apache) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Rien de sensible n'est atteignable (ADR-11) ---
    location ~ /\. { return 404; }
    location ^~ /storage/ { return 404; }

    # --- Backend Laravel : API, Sanctum, sonde ---
    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }
    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # En-têtes de proxy transmis TELS QUELS depuis Apache (schéma, host,
        # port, IP client). `trustProxies` côté Laravel les valide.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_read_timeout 60s;
    }

    # Lot 13 (ADR-32) — la page de saisie du nouveau mot de passe reçoit le
    # token de réinitialisation dans sa query string : exclue des logs d'accès
    # (défense en profondeur, en plus de l'expiration 60 min + l'usage unique).
    location = /mot-de-passe/nouveau {
        access_log off;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- Frontend React (SPA) — proxy vers le conteneur `frontend` ---
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
