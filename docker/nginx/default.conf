# Reverse proxy unique de l'application CASA.
#   /api/*  -> backend Laravel (PHP-FPM, via fastcgi)
#   /*      -> frontend React (build statique, conteneur "frontend")
#
# Squelette Lot 0 : pas de TLS ici (terminaison HTTPS à ajouter devant ce
# service au moment du déploiement réel — cf. docs/ADR.md).

server {
    listen 80;
    server_name _;

    # --- API Laravel ---
    location /api/ {
        root /var/www/html/public;
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        }
    }

    # Sonde de santé Laravel (route /up native depuis Laravel 11), utilisée
    # par le healthcheck du service nginx dans docker-compose.yml.
    location = /up {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # --- Frontend React (SPA) ---
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
