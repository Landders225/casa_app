# Reverse proxy unique de l'application CASA.
#   /api/*, /sanctum/*, /up  -> backend Laravel (PHP-FPM, via fastcgi)
#   /*                       -> frontend React (build statique, conteneur "frontend")
#
# Squelette Lot 0 : pas de TLS ici (terminaison HTTPS à ajouter devant ce
# service au moment du déploiement réel — cf. docs/ADR.md).
#
# Lot 2 : ajout du routage /sanctum/* (endpoint /sanctum/csrf-cookie de Sanctum
# SPA, ADR-01) et correction du fallback /api/* qui n'atteignait pas PHP-FPM
# (try_files retombait sur le proxy frontend).
#
# Lot 3b : client_max_body_size relevé pour l'upload des pièces justificatives
# (10 Mo applicatif + marge multipart). Toujours AUCUN service statique de
# storage/app/private (pièces hors webroot, ADR-11).

server {
    listen 80;
    server_name _;

    # Ne pas afficher la version de nginx dans l'en-tête Server / les pages
    # d'erreur (Lot 10, T3).
    server_tokens off;

    # Upload des pièces justificatives (limite applicative réelle : 10 Mo, cf.
    # config/filesystems + DeposerPieceRequest ; ici marge pour l'enveloppe
    # multipart). Un dépassement est rejeté ici en 413 avant d'atteindre PHP.
    client_max_body_size 13m;

    # --- Backend Laravel : API, Sanctum, sonde de santé ---
    # Aucune ressource statique sous ces préfixes : tout est délégué à index.php.
    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Point d'entrée PHP unique (Laravel). Cible des internal redirects ci-dessus.
    location = /index.php {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    # Lot 13 (ADR-32) — la page de saisie du nouveau mot de passe reçoit le
    # token de réinitialisation dans sa query string (?token=&email=). On
    # l'exclut des logs d'accès pour ne pas y archiver de token — défense en
    # profondeur en complément de l'expiration native (60 min) et de l'usage
    # unique (déjà suffisants seuls, mais un log ne devrait jamais porter de
    # secret évitable). `location =` (match exact) est prioritaire sur le
    # `location /` générique ci-dessous, quelle que soit la query string.
    location = /mot-de-passe/nouveau {
        access_log off;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend React (SPA) ---
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
