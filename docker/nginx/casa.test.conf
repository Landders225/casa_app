# =============================================================================
#  CASA — nginx, MODE TEST LOCAL EN HTTP DIRECT (Lot 11).
#
#  Navigateur ──HTTP──▶ http://<IP-serveur>:8090 ──▶ CE nginx ──▶ backend/frontend
#  PAS d'Apache, PAS de HTTPS, PAS de domaine. Étape intermédiaire jetable pour
#  valider le fonctionnel sur le serveur avant de monter Apache + TLS (§ 14).
#
#  ⚠️ AUCUN PROXY LÉGITIME EN AMONT. Le navigateur parle directement à nginx.
#  On IGNORE donc TOTALEMENT les en-têtes X-Forwarded-* entrants (un client
#  pourrait les forger — la même faille d'usurpation d'IP qu'on ferme pour le
#  mode Apache) :
#   - X-Forwarded-For   est REMPLACÉ par $remote_addr (l'IP TCP réelle du client) ;
#   - X-Forwarded-Proto est REMPLACÉ par $scheme ("http" ici).
#  Résultat : `$request->ip()` = vraie IP client → rate-limiting fiable, pas
#  d'usurpation possible. (`TRUSTED_PROXIES=172.31.243.0/24` fait juste confiance
#  à CE nginx pour lire l'en-tête qu'il vient de réécrire.)
#
#  ⚠️ MODE TEST UNIQUEMENT — cookies NON `Secure` (SESSION_SECURE_COOKIE=false).
#  NE PAS exposer sur Internet. Passage en prod réelle = § 14 (Apache + HTTPS,
#  SESSION_SECURE_COOKIE=true, vrai domaine).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    client_max_body_size 13m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ /\. { return 404; }
    location ^~ /storage/ { return 404; }

    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }
    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # On IMPOSE la réalité (pas de passthrough) : $remote_addr est l'IP TCP
        # du navigateur (le port publié 0.0.0.0:8090 préserve l'IP source pour
        # le trafic réseau ; seul un `curl` depuis le serveur lui-même verrait
        # la gateway Docker — sans conséquence).
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;
        fastcgi_read_timeout 60s;
    }

    # Lot 13 (ADR-32) — la page de saisie du nouveau mot de passe reçoit le
    # token de réinitialisation dans sa query string : exclue des logs d'accès
    # (défense en profondeur, en plus de l'expiration 60 min + l'usage unique).
    location = /mot-de-passe/nouveau {
        access_log off;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
