# =============================================================================
#  CASA — nginx, MODE TEST LOCAL (Lot 11), DÉPLOYÉ EN RÉALITÉ DERRIÈRE APACHE.
#
#  Conçu à l'origine pour un navigateur parlant DIRECTEMENT à nginx (pas
#  d'Apache, pas de HTTPS, pas de domaine — § 14 de docs/DEPLOIEMENT.md). En
#  pratique, sur casa.cci.ci, un Apache existant (lui-même derrière un
#  équipement de bordure CCI, 172.30.1.1) a été placé en amont SANS faire le
#  switch documenté vers le mode Apache (§ 15, `casa.apache.conf`) — ce
#  fichier reste donc en service dans une topologie différente de celle pour
#  laquelle il a été écrit à l'origine.
#
#  ⚠️ BUG CORRIGÉ ICI (2026-10-05) : avant ce correctif, X-Forwarded-For était
#  ÉCRASÉ par $remote_addr SANS CONDITION — correct si nginx est le vrai bord
#  (aucun proxy légitime en amont), FAUX ici : $remote_addr valait alors
#  TOUJOURS la passerelle Docker (172.31.243.1 — Apache y arrive via le port
#  publié), donc TOUS les visiteurs partageaient le MÊME compteur de
#  rate-limiting → 429 sur des candidats réels. Preuve : logs nginx, 438
#  requêtes/h toutes avec client 172.31.243.1.
#
#  Correctif : module `real_ip`, restreint aux DEUX seuls sauts légitimes de
#  cette chaîne précise (ni plus large, jamais `*`, jamais un /16 ou /8) :
#   - 172.31.243.0/24 (= CASA_SUBNET) : la passerelle Docker — c'est Apache
#     qui arrive par le port publié ;
#   - 172.30.1.1/32 : l'équipement de bordure CCI, qu'Apache ajoute à la
#     chaîne X-Forwarded-For comme SON propre client perçu (observé dans les
#     logs : "IP_visiteur, 172.30.1.1").
#  Avec `real_ip_recursive on`, nginx dépouille la chaîne XFF de ces deux
#  sauts connus (en partant de la droite) et retient ce qu'il reste comme IP
#  réelle — un visiteur qui forge son propre X-Forwarded-For ne peut rien y
#  changer : ce qu'IL envoie n'est jamais dans cette liste de confiance, donc
#  jamais utilisé pour résoudre $remote_addr. `$remote_addr` est réécrit EN
#  PLACE par nginx une fois ce module actif : les
#  `fastcgi_param`/`proxy_set_header ... $remote_addr` plus bas n'ont PAS eu
#  besoin d'être modifiés, ils héritent automatiquement de la vraie IP.
#
#  X-Forwarded-Proto reste forcé à $scheme ("http", nginx n'a pas de TLS ici)
#  — mismatch cosmétique connu (le vrai schéma est https, terminé par Apache),
#  SANS effet observé dans le code CASA actuel (aucun `->secure()`/
#  `isSecure()` dans l'app ; `SESSION_SECURE_COOKIE` est une variable d'env
#  STATIQUE, jamais dérivée de la requête ; le lien de réinitialisation de mot
#  de passe utilise `config('app.url')`, pas une URL générée depuis le schéma
#  détecté) — délibérément NON corrigé ici.
#
#  ⚠️ MODE TEST — cookies NON `Secure` (SESSION_SECURE_COOKIE=false par
#  défaut). Si ce déploiement sert réellement des candidats sur un domaine
#  HTTPS, vérifier d'URGENCE `backend/.env.test-local` SUR LE SERVEUR
#  (APP_URL, SESSION_DOMAIN, SANCTUM_STATEFUL_DOMAINS, SESSION_SECURE_COOKIE)
#  — fichier gitignored, absent de ce dépôt, son contenu réel n'a pas pu être
#  vérifié au moment de ce correctif. Passage propre en prod réelle = § 14.7
#  puis § 15 (switch complet, déjà documenté, vers le mode Apache dédié).
# =============================================================================

# Restauration de l'IP client réelle — UNIQUEMENT dans cette topologie
# déviante (test local servi en réalité derrière Apache, cf. l'en-tête
# ci-dessus). Les deux sauts de confiance, et RIEN d'autre : voir le détail
# dans l'en-tête. ⚠️ Garder synchronisé avec CASA_SUBNET et l'IP de
# l'équipement de bordure CCI si l'un des deux change.
set_real_ip_from 172.31.243.0/24;
set_real_ip_from 172.30.1.1/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    client_max_body_size 13m;

    # DNS interne Docker (adresse FIXE, toujours 127.0.0.11) — force la
    # RÉ-RÉSOLUTION de `backend`/`frontend` ci-dessous à chaque expiration du
    # TTL, au lieu d'une résolution unique au démarrage/reload du worker
    # nginx. Sans ça, un `backend` ou `frontend` recréé (nouvelle IP Docker,
    # ex. après `up -d --build`) reste injoignable jusqu'au prochain restart
    # de nginx — 502 silencieux sur tout /api, vécu en conditions réelles.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ /\. { return 404; }
    location ^~ /storage/ { return 404; }

    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }
    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/html/public;
        # Variable, pas un hostname littéral : voir le commentaire `resolver`
        # en tête de fichier — force la ré-résolution périodique.
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # On IMPOSE la réalité (pas de passthrough) : $remote_addr est l'IP TCP
        # du navigateur (le port publié 0.0.0.0:8090 préserve l'IP source pour
        # le trafic réseau ; seul un `curl` depuis le serveur lui-même verrait
        # la gateway Docker — sans conséquence).
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;
        fastcgi_read_timeout 60s;
    }

    # Lot 13 (ADR-32) — la page de saisie du nouveau mot de passe reçoit le
    # token de réinitialisation dans sa query string : exclue des logs d'accès
    # (défense en profondeur, en plus de l'expiration 60 min + l'usage unique).
    location = /mot-de-passe/nouveau {
        access_log off;
        # Variable, pas un hostname littéral — voir le commentaire `resolver`
        # en tête de fichier.
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
