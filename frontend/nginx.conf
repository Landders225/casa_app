# nginx interne au conteneur `frontend` — sert le build statique de la SPA.
#
# Le reverse-proxy `nginx` du docker-compose route déjà /api, /sanctum et /up
# vers le backend ; ce conteneur ne voit donc que des requêtes de l'application
# React. La seule règle non triviale est le FALLBACK SPA : toute route client
# (/connexion, /candidat, ...) doit renvoyer index.html (sinon 404 sur rechargement
# ou accès direct). D-8a-1.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets buildés par Vite : hashés, donc immuables et cache long.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Lot 19 (correctif de revue) — le `mime.types` livré avec l'image nginx
    # ne connaît pas `.mjs` (extension récente) : nginx retombe sur
    # `default_type` (`application/octet-stream`). Le worker pdf.js
    # (`pdf.worker.min.mjs`) est chargé en `new Worker(url, {type:"module"})` :
    # un navigateur applique un contrôle STRICT du type MIME pour un script de
    # module (spec HTML) et refuse de l'exécuter si le type n'est pas
    # reconnu JS — sans cette ligne, l'aperçu PDF échouait silencieusement
    # (« Setting up fake worker », puis l'échec du fallback, observé en E2E).
    # `default_type` (pas `types{}`, qui REMPLACERAIT toute la table MIME
    # héritée plutôt que de l'étendre) et SCOPÉ à `.mjs` : les autres
    # extensions de `/assets/` ci-dessus restent résolues normalement.
    location ~* \.mjs$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        default_type text/javascript;
    }

    # Fallback SPA : la route inconnue retombe sur l'app React (routing client).
    location / {
        try_files $uri /index.html;
    }

    # index.html jamais mis en cache (référence les assets hashés courants).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
