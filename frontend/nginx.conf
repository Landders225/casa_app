# nginx interne au conteneur `frontend` — sert le build statique de la SPA.
#
# Le reverse-proxy `nginx` du docker-compose route déjà /api, /sanctum et /up
# vers le backend ; ce conteneur ne voit donc que des requêtes de l'application
# React. La seule règle non triviale est le FALLBACK SPA : toute route client
# (/connexion, /candidat, ...) doit renvoyer index.html (sinon 404 sur rechargement
# ou accès direct). D-8a-1.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets buildés par Vite : hashés, donc immuables et cache long.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : la route inconnue retombe sur l'app React (routing client).
    location / {
        try_files $uri /index.html;
    }

    # index.html jamais mis en cache (référence les assets hashés courants).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
