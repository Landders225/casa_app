# =============================================================================
#  CASA — Intégration continue (Lot 9c, ADR-28).
#
#  Reflète FIDÈLEMENT ce qu'on valide à la main à chaque lot :
#    backend  : php artisan test (PostgreSQL réel) + vendor/bin/pint --test
#    frontend : npm run lint (oxlint) + npm run test (vitest) + npm run build
#    prod     : docker compose ... config -q  (valide l'override de prod)
#    e2e      : la stack Docker complète + npm run e2e --project=desktop
#               (couverture fonctionnelle ; mobile + intégration = nightly.yml)
#
#  ⚠️  Le dépôt n'a pas encore de remote. Pour activer ce workflow :
#        git remote add origin <url>  &&  git push -u origin main
#      Chaque étape a été prouvée en local (Lot 9c).
# =============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests (PostgreSQL) + Pint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: casa
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: casa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U casa -d casa"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, pgsql, zip, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env

      - name: Base de test PostgreSQL
        run: php artisan casa:test-db

      - name: php artisan test
        run: php artisan test

      - name: Pint (style)
        run: vendor/bin/pint --test

  frontend:
    name: Frontend — lint + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm run lint (oxlint)
        run: npm run lint

      - name: npm run test (vitest)
        run: npm run test

      - name: npm run build
        run: |
          cp .env.example .env
          npm run build

  prod-config:
    name: Prod — validation de l'override compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fichiers .env de prod (placeholders, validation uniquement)
        run: |
          cp .env.production.example .env.production
          cp backend/.env.production.example backend/.env.production
          sed -i 's/CHANGE_ME[^"]*/ci-placeholder-not-a-secret/' .env.production backend/.env.production

      - name: docker compose config (override !override + interpolation)
        run: >-
          docker compose --env-file .env.production
          -f docker-compose.yml -f docker-compose.prod.yml config -q

  e2e:
    name: E2E — par-espace (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fichiers .env
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Démarrage de la stack Docker
        run: |
          docker compose up -d --build
          echo "Attente des 4 services healthy…"
          for i in $(seq 1 60); do
            healthy=$(docker compose ps --format '{{.Health}}' | grep -cx healthy || true)
            [ "$healthy" -ge 4 ] && { echo "OK ($healthy/4)"; break; }
            sleep 5
          done
          docker compose ps

      - name: APP_KEY + migrate + seed
        run: |
          docker compose exec -T backend php artisan key:generate --force
          docker compose exec -T backend php artisan migrate:fresh --seed --force

      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e -- --project=desktop

      - name: Logs de la stack (si échec)
        if: failure()
        run: docker compose logs --no-color

      - name: Traces Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/e2e/.results
          retention-days: 7
          if-no-files-found: ignore
